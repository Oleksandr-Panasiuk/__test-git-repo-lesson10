<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">
  <title>Мистецтво SVG</title>
</head>

<body>

  <main class="svg-page">
    <h1 class="svg-page__main-title">Мистецтво SVG: фігури та анімація</h1>

    <!-- 1. Квадрат -->
    <div class="svg-block">
      <h2 class="svg-block__title">Квадрат</h2>
      <svg width="200" height="200" viewBox="0 0 200 200">
        <rect x="5" y="5" width="190" height="190" fill="#34547a" stroke="#000000" stroke-width="5" />
      </svg>
    </div>

    <!-- 2. Прямокутник -->
    <div class="svg-block">
      <h2 class="svg-block__title">Прямокутник</h2>
      <svg width="240" height="160" viewBox="0 0 240 160">
        <rect x="5" y="5" width="230" height="150" fill="#edeef0" stroke="#727272" stroke-width="5" />
      </svg>
    </div>

    <!-- 3. Коло (З вбудованою SVG-анімацією заливки та контуру) -->
    <div class="svg-block">
      <h2 class="svg-block__title">Коло (Анімоване)</h2>
      <svg width="200" height="200" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="90" fill="#ffc107" stroke="#e91e63" stroke-width="5">
          <!-- Анімація зміни кольору заливки -->
          <animate attributeName="fill" values="#ffc107;#00bcd4;#ffc107" dur="3s" repeatCount="indefinite" />
          <!-- Анімація зміни кольору контуру -->
          <animate attributeName="stroke" values="#e91e63;#3f51b5;#e91e63" dur="3s" repeatCount="indefinite" />
        </circle>
      </svg>
    </div>

    <!-- 4. Еліпс -->
    <div class="svg-block">
      <h2 class="svg-block__title">Еліпс</h2>
      <svg width="260" height="160" viewBox="0 0 260 160">
        <ellipse cx="130" cy="80" rx="120" ry="70" fill="#727272" stroke="#34547a" stroke-width="5" />
      </svg>
    </div>
  </main>

</body>

</html>
